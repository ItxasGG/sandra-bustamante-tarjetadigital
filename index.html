<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandra Bustamante</title>
<meta name="description" content="Sandra Bustamante · Directora de formación de Solentine. Formadora y especialista en tratamientos faciales y corporales.">
<meta name="theme-color" content="#f6efe9">

<!-- Vista previa al compartir el enlace (WhatsApp, redes...) -->
<meta property="og:title" content="Sandra Bustamante · Solentine">
<meta property="og:description" content="Formadora y especialista en tratamientos faciales y corporales">
<meta property="og:type" content="profile">
<meta property="og:image" content="foto.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6efe9;
    --bg-2: #efe3d9;
    --card: #fffdfb;
    --ink: #2b2420;
    --muted: #8a7b72;
    --line: #eadfd6;
    --accent: #b88a6e;
    --accent-ink: #ffffff;
    --chip: #f7f0ea;
    --shadow: 0 20px 50px -20px rgba(92, 62, 42, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1816;
      --bg-2: #251f1c;
      --card: #2a2420;
      --ink: #f4ece6;
      --muted: #b3a49a;
      --line: #3a322d;
      --accent: #c99b7f;
      --accent-ink: #1c1816;
      --chip: #332b27;
      --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Jost", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 60%);
    background-color: var(--bg);
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 40px 24px 28px;
    text-align: center;
    animation: rise .6s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Foto / iniciales */
  .avatar {
    width: 124px; height: 124px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 200deg, var(--accent), #e8cbb7, var(--accent));
  }
  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 3px solid var(--card);
    background: var(--chip);
    overflow: hidden;
    display: grid; place-items: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 44px; font-weight: 600;
    color: var(--accent);
    letter-spacing: .02em;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: .01em;
  }
  .role {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tagline {
    margin: 14px auto 0;
    max-width: 30ch;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Botones de contacto */
  .contact {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 28px 0 14px;
  }
  .btn-round {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 4px 12px;
    border-radius: 18px;
    background: var(--chip);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 400;
    transition: transform .15s ease, background .2s ease;
  }
  .btn-round:active { transform: scale(.96); }
  .btn-round .ico {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn-round svg { width: 22px; height: 22px; }

  /* Botón principal */
  .btn-main {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--ink);
    color: var(--card);
    font: 500 15px/1 "Jost", sans-serif;
    letter-spacing: .04em;
    cursor: pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  .btn-main:active { transform: scale(.98); }
  .btn-main svg { width: 20px; height: 20px; }

  /* Enlaces secundarios */
  .links { margin-top: 12px; display: grid; gap: 8px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    min-height: 52px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 14.5px;
    text-align: left;
    background: transparent;
    width: 100%;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s ease;
  }
  .link:active { background: var(--chip); }
  .link svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
  .link span { flex: 1; }
  .link small { color: var(--muted); font-size: 12.5px; }

  .footer {
    margin-top: 22px;
    font-size: 11.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Ventana QR */
  .modal {
    position: fixed; inset: 0;
    background: rgba(28, 22, 18, .55);
    backdrop-filter: blur(4px);
    display: none; place-items: center;
    padding: 16px;
    z-index: 10;
  }
  .modal.open { display: grid; }
  .modal-box {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px 20px;
    width: 100%; max-width: 320px;
    text-align: center;
  }
  .modal-box h2 { font: 600 24px "Cormorant Garamond", serif; margin-bottom: 4px; }
  .modal-box p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  #qr {
    background: #fff; padding: 14px; border-radius: 16px;
    display: inline-block; line-height: 0;
  }
  #qr img, #qr canvas { width: 200px !important; height: 200px !important; }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--chip); color: var(--ink); font: 500 14px "Jost", sans-serif; cursor: pointer;
  }
  .modal-actions .primary { background: var(--ink); color: var(--card); border-color: var(--ink); }

  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--card);
    padding: 12px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .3s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 480px) {
    .card { padding: 48px 32px 32px; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="avatar">
    <div class="avatar-inner" id="avatar">
      <!-- Si existe "foto.jpg" junto a este archivo se muestra; si no, aparecen las iniciales -->
      <img src="foto.jpg" alt="Sandra Bustamante" onerror="this.remove(); document.getElementById('avatar').textContent='SB';">
    </div>
  </div>

  <h1>Sandra Bustamante</h1>
  <p class="role">Directora de formación · Solentine</p>
  <p class="tagline">Formadora y especialista en tratamientos faciales y corporales</p>

  <nav class="contact" aria-label="Contacto">
    <a class="btn-round" id="btn-wa" target="_blank" rel="noopener">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.43 9.43 0 0 1-4.8-1.32l-.35-.2-3.57.93.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.24-9.44 9.45-9.44 2.52 0 4.89.99 6.67 2.77a9.37 9.37 0 0 1 2.76 6.68c0 5.2-4.24 9.44-9.44 9.44zm8.03-17.47A11.28 11.28 0 0 0 12.04.7C5.78.7.69 5.79.69 12.04c0 2 .52 3.95 1.52 5.67L.6 23.3l5.72-1.5a11.33 11.33 0 0 0 5.42 1.38h.01c6.25 0 11.34-5.09 11.35-11.34 0-3.03-1.18-5.88-3.32-8.02z"/></svg>
      </span>
      WhatsApp
    </a>
    <a class="btn-round" id="btn-tel">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      Llamar
    </a>
    <a class="btn-round" id="btn-mail">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      </span>
      Email
    </a>
  </nav>

  <button class="btn-main" id="btn-vcard" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    Guardar contacto
  </button>

  <div class="links">
    <a class="link" id="link-carta" href="carta-servicios.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
      <span>Carta de servicios</span><small>PDF</small>
    </a>
    <a class="link" id="link-ig" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
      <span>Instagram</span><small id="ig-handle"></small>
    </a>
    <a class="link" id="link-web" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Web</span><small>solentine.com</small>
    </a>
    <button class="link" id="btn-share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4h-4"/></svg>
      <span>Compartir tarjeta</span><small>QR · enlace</small>
    </button>
  </div>

  <p class="footer">Solentine</p>
</main>

<!-- Ventana con el QR de la tarjeta -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <h2 id="modal-title">Escanea mi tarjeta</h2>
    <p>Apunta con la cámara del móvil</p>
    <div id="qr"></div>
    <div class="modal-actions">
      <button type="button" id="btn-copy">Copiar enlace</button>
      <button type="button" class="primary" id="btn-close">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ===== Datos de contacto (edita aquí si algo cambia) =====
  const DATA = {
    firstName: "Sandra",
    lastName: "Bustamante",
    title: "Directora de formación",
    org: "Solentine",
    note: "Formadora y especialista en tratamientos faciales y corporales",
    phone: "+34679179178",
    email: "sandrasecretos@gmail.com",
    instagram: "coco.i.bilma",
    web: "https://solentine.com",
    whatsappText: "Hola Sandra, te escribo desde tu tarjeta digital."
  };

  const $ = (id) => document.getElementById(id);
  const digits = DATA.phone.replace(/\D/g, "");

  $("btn-wa").href = `https://wa.me/${digits}?text=${encodeURIComponent(DATA.whatsappText)}`;
  $("btn-tel").href = `tel:${DATA.phone}`;
  $("btn-mail").href = `mailto:${DATA.email}`;
  $("link-ig").href = `https://instagram.com/${DATA.instagram}`;
  $("ig-handle").textContent = `@${DATA.instagram}`;
  $("link-web").href = DATA.web;

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ===== vCard =====
  function esc(v) { return String(v).replace(/([,;\\])/g, "\\$1"); }

  $("btn-vcard").addEventListener("click", () => {
    const vcf = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${esc(DATA.lastName)};${esc(DATA.firstName)};;;`,
      `FN:${esc(DATA.firstName + " " + DATA.lastName)}`,
      `ORG:${esc(DATA.org)}`,
      `TITLE:${esc(DATA.title)}`,
      `TEL;TYPE=CELL,VOICE:${DATA.phone}`,
      `EMAIL;TYPE=INTERNET:${DATA.email}`,
      `URL:${DATA.web}`,
      `X-SOCIALPROFILE;TYPE=instagram:https://instagram.com/${DATA.instagram}`,
      `NOTE:${esc(DATA.note)} · Instagram: @${DATA.instagram}`,
      "END:VCARD"
    ].join("\r\n");

    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Sandra-Bustamante.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("Contacto descargado");
  });

  // ===== Compartir / QR =====
  const pageUrl = location.href.split("#")[0];
  let qrDone = false;

  function openQR() {
    if (!qrDone && window.QRCode) {
      new QRCode($("qr"), {
        text: pageUrl, width: 400, height: 400,
        colorDark: "#2b2420", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      qrDone = true;
    }
    $("modal").classList.add("open");
  }

  $("btn-share").addEventListener("click", openQR);

  $("btn-close").addEventListener("click", () => $("modal").classList.remove("open"));
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("open"); });

  // Si el móvil permite compartir de forma nativa, el botón abre ese menú; si no, copia el enlace
  if (navigator.share) $("btn-copy").textContent = "Compartir";
  $("btn-copy").addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: "Sandra Bustamante · Solentine", text: DATA.note, url: pageUrl }); }
      catch (e) {}
      return;
    }
    try { await navigator.clipboard.writeText(pageUrl); toast("Enlace copiado"); }
    catch { toast(pageUrl); }
  });
</script>
</body>
</html>
